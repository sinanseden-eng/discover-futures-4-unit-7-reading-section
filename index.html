<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 7 Reading: The Power of Color</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .slide-in { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-btn.active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- LESSON 1 COMPONENTS ---

        const FactOpinionPractice = () => {
            const [revealed, setRevealed] = useState(Array(5).fill(false));

            const questions = [
                { statement: "Red is the most beautiful color for a sports car.", answer: "Opinion", hint: "Uses the subjective word 'beautiful'." },
                { statement: "A survey of 200 homes showed people in blue bedrooms slept the most.", answer: "Fact", hint: "Provides specific, verifiable numbers and data." },
                { statement: "Everyone feels relaxed when they look at the ocean.", answer: "Opinion", hint: "Uses the absolute word 'Everyone' and assumes a feeling." },
                { statement: "In the 1970s, a researcher conducted an experiment with blue steaks.", answer: "Fact", hint: "Refers to a specific, historical event that can be proven." },
                { statement: "Banning red uniforms is the best way to make sports fair.", answer: "Opinion", hint: "Uses 'the best way', which is a value judgment." }
            ];

            const toggleReveal = (index) => {
                const newRevealed = [...revealed];
                newRevealed[index] = true;
                setRevealed(newRevealed);
            };

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
                    <h3 className="text-2xl font-bold text-slate-800 mb-4"><i className="fas fa-tasks text-indigo-500 mr-2"></i> 5-Minute Practice</h3>
                    <p className="text-slate-600 mb-6">Read each statement. Is it a Fact or an Opinion? Click to reveal the answer.</p>
                    
                    <div className="space-y-4">
                        {questions.map((q, idx) => (
                            <div key={idx} className="border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 hover:bg-slate-50 transition">
                                <p className="text-lg font-medium text-slate-700 flex-1">"{q.statement}"</p>
                                
                                {!revealed[idx] ? (
                                    <button onClick={() => toggleReveal(idx)} className="px-6 py-2 bg-indigo-100 text-indigo-700 font-bold rounded-lg hover:bg-indigo-200 transition whitespace-nowrap">
                                        Reveal Answer
                                    </button>
                                ) : (
                                    <div className="flex items-center gap-3 slide-in whitespace-nowrap">
                                        <span className={`px-4 py-1 rounded-full text-white font-bold ${q.answer === 'Fact' ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                                            {q.answer}
                                        </span>
                                        <span className="text-sm text-slate-500 italic max-w-xs hidden lg:block">({q.hint})</span>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Lesson1 = ({ setActiveTab }) => (
            <div className="max-w-5xl mx-auto animate-fade-in pb-12">
                <div className="bg-indigo-600 text-white rounded-3xl p-8 shadow-lg mb-8 relative overflow-hidden">
                    {/* Secret corner for the teacher to access Lesson 2 */}
                    <div 
                        className="absolute top-0 right-0 w-20 h-20 z-50 cursor-default" 
                        onClick={() => setActiveTab('lesson2')}
                    ></div>
                    
                    <div className="relative z-10">
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold tracking-wider uppercase mb-4 inline-block">Lesson 1 (40 Mins)</span>
                        <h2 className="text-4xl font-extrabold mb-2">Reading Critically: Fact vs. Opinion</h2>
                        <p className="text-indigo-100 text-lg mb-5">Before we read about how colors affect us, we need to learn how to evaluate the information we are given.</p>
                        
                        <div className="bg-indigo-800/50 p-4 rounded-xl border border-indigo-500/30 text-indigo-50 max-w-4xl">
                            <p className="text-md leading-relaxed">
                                <i className="fas fa-graduation-cap text-yellow-400 mr-2 text-xl align-middle"></i> 
                                <strong className="text-white tracking-wide uppercase text-sm mr-1">Exam Strategy:</strong> 
                                Distinguishing between a fact and an opinion is extremely important in both the <strong className="text-yellow-300">B2 First and IELTS</strong> reading exams. In these exams, questions frequently ask you to identify factual information and a writer's specific claims or views (such as in IELTS "True/False/Not Given" tasks). To answer correctly, you must be able to separate the writer's subjective opinions from the objective background facts.
                            </p>
                        </div>
                    </div>
                    <i className="fas fa-search absolute -bottom-10 -right-10 text-9xl text-indigo-500 opacity-50"></i>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Fact Card */}
                    <div className="bg-white rounded-2xl shadow-sm border-t-8 border-emerald-500 p-6">
                        <h3 className="text-3xl font-black text-emerald-600 mb-2">FACT</h3>
                        <p className="text-slate-600 font-medium mb-4">A statement that can be proven true or false with objective evidence. <strong className="text-emerald-700">Because it relies on objective truth, a fact cannot be debated.</strong></p>
                        <div className="bg-emerald-50 p-4 rounded-xl mb-4">
                            <p className="font-bold text-emerald-800 text-sm uppercase mb-1">Example:</p>
                            <p className="text-emerald-900 italic">"The survey involved 200 homes around the country."</p>
                        </div>
                        <ul className="space-y-3 text-sm text-slate-600">
                            <li className="flex items-start">
                                <i className="fas fa-check text-emerald-500 mt-1 mr-2"></i>
                                <span>"The human body requires water to function properly." This is a fact because it can be proven through scientific testing.</span>
                            </li>
                            <li className="flex items-start">
                                <i className="fas fa-check text-emerald-500 mt-1 mr-2"></i>
                                <span>"The first modern Olympic Games were held in 1896." We can verify this statement by checking historical records.</span>
                            </li>
                            <li className="flex items-start">
                                <i className="fas fa-check text-emerald-500 mt-1 mr-2"></i>
                                <span>"There are 60 minutes in a single hour." This is a measurable quantity that is objectively true for everyone.</span>
                            </li>
                        </ul>
                    </div>

                    {/* Opinion Card */}
                    <div className="bg-white rounded-2xl shadow-sm border-t-8 border-rose-500 p-6">
                        <h3 className="text-3xl font-black text-rose-600 mb-2">OPINION</h3>
                        <p className="text-slate-600 font-medium mb-4">A statement that expresses a belief, feeling, or personal judgment. <strong className="text-rose-700">Because opinions are subjective, they can be openly discussed and debated.</strong></p>
                        <div className="bg-rose-50 p-4 rounded-xl mb-4">
                            <p className="font-bold text-rose-800 text-sm uppercase mb-1">Example:</p>
                            <p className="text-rose-900 italic">"Blue is the most relaxing color for a bedroom."</p>
                        </div>
                        <ul className="space-y-3 text-sm text-slate-600">
                            <li className="flex items-start">
                                <i className="fas fa-check text-rose-500 mt-1 mr-2"></i>
                                <span>"I think vanilla ice cream is better than chocolate." This is an opinion because it expresses a personal preference that others might disagree with.</span>
                            </li>
                            <li className="flex items-start">
                                <i className="fas fa-check text-rose-500 mt-1 mr-2"></i>
                                <span>"That was the most exciting movie I have ever seen." Words like 'exciting' and 'best' are value judgments, not measurable facts.</span>
                            </li>
                            <li className="flex items-start">
                                <i className="fas fa-check text-rose-500 mt-1 mr-2"></i>
                                <span>"It will probably rain this weekend." Predictions about the future are opinions because they haven't happened yet and cannot be proven right now.</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <FactOpinionPractice />

                <div className="bg-slate-800 text-white rounded-2xl p-8 mt-8 shadow-lg">
                    <h3 className="text-2xl font-bold mb-4"><i className="fas fa-book-open text-sky-400 mr-2"></i> Connect to Student Book (Page 72)</h3>
                    <p className="text-slate-300 text-lg mb-6">Open your books to Ex 2 & 3. We are going to read three articles about how color affects sports, sleep, and diet.</p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-slate-700 p-4 rounded-xl border border-slate-600">
                            <p className="font-bold text-rose-400 mb-1">Article A:</p>
                            <p className="text-sm text-slate-300">Does wearing red make you win at sports?</p>
                        </div>
                        <div className="bg-slate-700 p-4 rounded-xl border border-slate-600">
                            <p className="font-bold text-sky-400 mb-1">Article B:</p>
                            <p className="text-sm text-slate-300">Is blue the secret to a good night's sleep?</p>
                        </div>
                        <div className="bg-slate-700 p-4 rounded-xl border border-slate-600">
                            <p className="font-bold text-emerald-400 mb-1">Article C:</p>
                            <p className="text-sm text-slate-300">Can color help us eat a healthier diet?</p>
                        </div>
                    </div>
                    <p className="mt-6 font-medium text-sky-200">As you read, ask yourself: What is fact, and what is opinion? Which article is the least convincing?</p>
                </div>
            </div>
        );

        // --- LESSON 2 COMPONENTS ---

        const PenaltyShootOut = () => {
            const [currentQ, setCurrentQ] = useState(0);
            const [teamAScore, setTeamAScore] = useState(0);
            const [teamBScore, setTeamBScore] = useState(0);
            const [activeTeam, setActiveTeam] = useState('A');
            const [gameState, setGameState] = useState('question'); // question -> result -> penalty -> next
            const [selectedAnswer, setSelectedAnswer] = useState(null);

            const questions = [
                { q: "Competitors in red always win Olympic boxing matches.", ans: "False", exp: "The article says they win over 60% of the time, not always." },
                { q: "The university study looked at results from swimming.", ans: "False", exp: "It looked at boxing, wrestling, and taekwondo." },
                { q: "Male monkeys with red coloring tend to be more powerful.", ans: "True", exp: "This is explicitly stated as an evolutionary observation." },
                { q: "Yellow bedrooms provide the least amount of sleep.", ans: "False", exp: "Purple bedrooms scored the worst in the survey." },
                { q: "The sleep survey involved 200 homes around the country.", ans: "True", exp: "This is a fact stated at the end of Article B." },
                { q: "People in blue bedrooms dream more than people in green bedrooms.", ans: "Not Given", exp: "The text only mentions vivid dreams in relation to purple bedrooms." },
                { q: "Charles Spence believes humans evolved to avoid blue meat because it might be rotten.", ans: "True", exp: "This is his theory explained in Article C." },
                { q: "Participants in a 1970s experiment got sick because the meat tasted bad.", ans: "False", exp: "They got sick because of visual disgust when the lights changed; the meat actually tasted good." },
                { q: "Green drinks always contain more sugar than pink drinks.", ans: "Not Given", exp: "Only one specific test was mentioned, not a general rule for all drinks." },
                { q: "Banning red uniforms in sports will happen by the next Olympics.", ans: "Not Given", exp: "The text says they 'may have to be banned', but gives no specific timeline." }
            ];

            const handleAnswer = (choice) => {
                setSelectedAnswer(choice);
                if (choice === questions[currentQ].ans) {
                    setGameState('penalty');
                    if (activeTeam === 'A') setTeamAScore(prev => prev + 1);
                    else setTeamBScore(prev => prev + 1);
                } else {
                    setGameState('result');
                }
            };

            const handlePenalty = (scored) => {
                if (scored) {
                    if (activeTeam === 'A') setTeamAScore(prev => prev + 1);
                    else setTeamBScore(prev => prev + 1);
                }
                setGameState('result');
            };

            const nextQuestion = () => {
                setSelectedAnswer(null);
                setGameState('question');
                setActiveTeam(activeTeam === 'A' ? 'B' : 'A');
                setCurrentQ(prev => prev + 1);
            };

            if (currentQ >= questions.length) {
                return (
                    <div className="bg-white p-10 rounded-2xl shadow-lg text-center border border-slate-200">
                        <i className="fas fa-trophy text-6xl text-yellow-400 mb-4"></i>
                        <h2 className="text-4xl font-black text-slate-800 mb-6">Match Over!</h2>
                        <div className="flex justify-center items-center gap-8 mb-8">
                            <div className="text-center">
                                <p className="text-xl font-bold text-rose-500 mb-2">Team A</p>
                                <p className="text-5xl font-black text-slate-800">{teamAScore}</p>
                            </div>
                            <div className="text-4xl font-bold text-slate-300">-</div>
                            <div className="text-center">
                                <p className="text-xl font-bold text-sky-500 mb-2">Team B</p>
                                <p className="text-5xl font-black text-slate-800">{teamBScore}</p>
                            </div>
                        </div>
                        <p className="text-xl text-slate-600 font-medium">Scroll down to move to the Outdoor Discussion!</p>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                    {/* Scoreboard Header */}
                    <div className="bg-slate-800 text-white p-6 flex justify-between items-center">
                        <div className={`text-center px-6 py-2 rounded-xl border-2 ${activeTeam === 'A' ? 'border-rose-500 bg-rose-500/20' : 'border-transparent'}`}>
                            <p className="text-sm font-bold text-rose-400 uppercase tracking-widest">Team A</p>
                            <p className="text-4xl font-black">{teamAScore}</p>
                        </div>
                        <div className="text-center">
                            <i className="fas fa-futbol text-3xl text-emerald-400 mb-2"></i>
                            <p className="text-sm font-bold text-slate-400 uppercase tracking-widest">Round {Math.floor(currentQ/2) + 1}</p>
                        </div>
                        <div className={`text-center px-6 py-2 rounded-xl border-2 ${activeTeam === 'B' ? 'border-sky-500 bg-sky-500/20' : 'border-transparent'}`}>
                            <p className="text-sm font-bold text-sky-400 uppercase tracking-widest">Team B</p>
                            <p className="text-4xl font-black">{teamBScore}</p>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div className="p-8">
                        <p className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Question {currentQ + 1} (Team {activeTeam})</p>
                        <h3 className="text-2xl font-bold text-slate-800 mb-8 leading-relaxed">"{questions[currentQ].q}"</h3>

                        {gameState === 'question' && (
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <button onClick={() => handleAnswer('True')} className="py-4 rounded-xl font-bold text-xl bg-emerald-50 text-emerald-700 border-2 border-emerald-200 hover:bg-emerald-500 hover:text-white hover:border-emerald-600 transition">True</button>
                                <button onClick={() => handleAnswer('False')} className="py-4 rounded-xl font-bold text-xl bg-rose-50 text-rose-700 border-2 border-rose-200 hover:bg-rose-500 hover:text-white hover:border-rose-600 transition">False</button>
                                <button onClick={() => handleAnswer('Not Given')} className="py-4 rounded-xl font-bold text-xl bg-slate-50 text-slate-700 border-2 border-slate-200 hover:bg-slate-600 hover:text-white hover:border-slate-700 transition">Not Given</button>
                            </div>
                        )}

                        {gameState === 'penalty' && (
                            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-6 text-center slide-in">
                                <i className="fas fa-check-circle text-5xl text-emerald-500 mb-4"></i>
                                <h4 className="text-2xl font-black text-emerald-700 mb-2">Correct! (+1 Point)</h4>
                                <p className="text-emerald-800 font-medium mb-6">You earned a penalty kick! Step up to the ball...</p>
                                
                                <div className="bg-white p-6 rounded-xl shadow-sm inline-block">
                                    <p className="text-sm font-bold text-slate-500 uppercase mb-4">Teacher: Did they score the penalty?</p>
                                    <div className="flex gap-4 justify-center">
                                        <button onClick={() => handlePenalty(true)} className="px-6 py-3 bg-emerald-500 text-white font-bold rounded-lg hover:bg-emerald-600"><i className="fas fa-futbol mr-2"></i> GOAL! (+1)</button>
                                        <button onClick={() => handlePenalty(false)} className="px-6 py-3 bg-rose-500 text-white font-bold rounded-lg hover:bg-rose-600"><i className="fas fa-times mr-2"></i> SAVED (0)</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'result' && (
                            <div className="slide-in">
                                <div className={`p-4 rounded-t-xl border-t border-x ${selectedAnswer === questions[currentQ].ans ? 'bg-emerald-100 border-emerald-300' : 'bg-rose-100 border-rose-300'}`}>
                                    <p className="font-bold text-lg">
                                        {selectedAnswer === questions[currentQ].ans ? <span className="text-emerald-700"><i className="fas fa-check mr-2"></i> Correct Answer</span> : <span className="text-rose-700"><i className="fas fa-times mr-2"></i> Incorrect Answer</span>}
                                    </p>
                                </div>
                                <div className="p-6 bg-slate-50 border border-slate-200 rounded-b-xl mb-6">
                                    <p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Explanation:</p>
                                    <p className="text-xl font-medium text-slate-800"><span className="font-black text-indigo-600 mr-2">[{questions[currentQ].ans}]</span> {questions[currentQ].exp}</p>
                                </div>
                                <button onClick={nextQuestion} className="w-full py-4 bg-slate-800 text-white font-bold text-xl rounded-xl hover:bg-slate-700 transition">
                                    Next Question <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Lesson2 = ({ setActiveTab }) => (
            <div className="max-w-5xl mx-auto animate-fade-in pb-12">
                <div className="bg-emerald-600 text-white rounded-3xl p-8 shadow-lg mb-8 relative overflow-hidden">
                    {/* Secret corner for the teacher to go back to Lesson 1 */}
                    <div 
                        className="absolute top-0 right-0 w-20 h-20 z-50 cursor-default" 
                        onClick={() => setActiveTab('lesson1')}
                    ></div>

                    <div className="relative z-10">
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold tracking-wider uppercase mb-4 inline-block">Lesson 2 (40 Mins)</span>
                        <h2 className="text-4xl font-extrabold mb-2">Outdoor Action: Reading Review</h2>
                        <p className="text-emerald-100 text-lg">Take the class outside to the sports field! Combine reading comprehension with physical activity and critical debate.</p>
                    </div>
                    <i className="fas fa-sun absolute -bottom-10 -right-10 text-9xl text-emerald-500 opacity-50"></i>
                </div>

                <div className="mb-12">
                    <h3 className="text-3xl font-black text-slate-800 mb-6 flex items-center"><i className="fas fa-futbol text-emerald-500 mr-3"></i> T/F/NG Penalty Shoot-Out</h3>
                    <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500 mb-8">
                        <p className="font-bold text-slate-700 mb-2">Teacher Rules:</p>
                        <ul className="list-disc list-inside text-slate-600 space-y-1">
                            <li>Divide the class into two teams. Pick a fixed goalkeeper.</li>
                            <li>Use this digital scoreboard. Ask a student from the active team the T/F/NG question.</li>
                            <li>If they answer correctly, they earn <strong className="text-emerald-600">1 point</strong> and a chance to shoot a penalty.</li>
                            <li>If they score the penalty against the goalie, they earn <strong className="text-emerald-600">another 1 point</strong>.</li>
                        </ul>
                        <p className="text-sm text-slate-400 mt-4 italic"></p>
                    </div>
                    <PenaltyShootOut />
                </div>

                <div className="border-t-4 border-slate-200 pt-12">
                    <h3 className="text-3xl font-black text-slate-800 mb-6 flex items-center"><i className="fas fa-users text-indigo-500 mr-3"></i> Outdoor Discussion: The Value Continuum</h3>
                    
                    <div className="bg-indigo-50 p-6 rounded-xl border border-indigo-100 mb-8">
                        <h4 className="font-bold text-indigo-800 text-lg mb-2">Method: Value Continuum</h4>
                        <p className="text-indigo-900 mb-4">Since we are already outdoors on the field, we will use a physical discussion method. Use a line on the sports field (or a piece of rope). Explain to students that one end of the line represents <strong>Strongly Agree</strong> and the other end represents <strong>Strongly Disagree</strong>.</p>
                        <p className="text-indigo-900 mb-4">Read a statement. Students must physically walk to the point on the line that represents their opinion. Ask students standing at different points on the line to defend their position.</p>
                        <p className="text-sm text-indigo-700 italic"></p>
                    </div>

                    <div className="space-y-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <span className="bg-rose-100 text-rose-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 1 (Critical Thinking)</span>
                            <p className="text-2xl font-medium text-slate-700 italic">"The color of our environment (rooms, food, clothes) manipulates our choices without us realizing it."</p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <span className="bg-sky-100 text-sky-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 2 (Critical Thinking)</span>
                            <p className="text-2xl font-medium text-slate-700 italic">"Sports organizations should ban red uniforms because they give athletes an unfair psychological advantage."</p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <span className="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 3 (Text Connection - Page 74)</span>
                            <p className="text-2xl font-medium text-slate-700 italic">"Color is the most important factor in determining human performance."</p>
                            <p className="mt-4 text-slate-500 font-medium border-t border-slate-100 pt-4"><i className="fas fa-microphone mr-2"></i> Follow-up: What factors <em>apart</em> from color can affect your performance in sports, in class, or in other areas?</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('lesson1');

            return (
                <div className="min-h-screen">
                    <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4">
                            <div className="flex justify-center items-center py-4">
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight">Unit 7 Reading</h1>
                            </div>
                        </div>
                    </header>

                    <main className="px-4 py-8">
                        {activeTab === 'lesson1' ? <Lesson1 setActiveTab={setActiveTab} /> : <Lesson2 setActiveTab={setActiveTab} />}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
