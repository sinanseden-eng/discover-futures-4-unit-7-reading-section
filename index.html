<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 7 Reading Lessons</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for transpiling JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- LESSON 1 COMPONENTS ---
        const FactOpinionPractice = () => {
            const statements = [
                { text: "Water boils at 100 degrees Celsius at sea level.", answer: "Fact", type: "fact" },
                { text: "Dogs make much better pets than cats.", answer: "Opinion", type: "opinion" },
                { text: "The Eiffel Tower is located in Paris, France.", answer: "Fact", type: "fact" },
                { text: "Summer is the most enjoyable season of the year.", answer: "Opinion", type: "opinion" },
                { text: "Humans need oxygen to survive.", answer: "Fact", type: "fact" }
            ];

            const [revealed, setRevealed] = useState({});

            const toggleReveal = (index) => {
                setRevealed(prev => ({ ...prev, [index]: !prev[index] }));
            };

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-8">
                    <h3 className="text-2xl font-bold text-slate-800 mb-4"><i className="fas fa-tasks text-indigo-500 mr-2"></i> 5-Minute Practice</h3>
                    <p className="text-slate-600 mb-6">Read each statement. Is it a Fact or an Opinion? Click to reveal the answer.</p>
                    
                    <div className="space-y-3">
                        {statements.map((item, index) => (
                            <div 
                                key={index} 
                                onClick={() => toggleReveal(index)}
                                className="p-4 rounded-xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition cursor-pointer flex justify-between items-center group bg-slate-50"
                            >
                                <span className="text-slate-700 font-medium text-lg pr-4">{item.text}</span>
                                {revealed[index] ? (
                                    <span className={`font-bold px-4 py-1.5 rounded-lg shadow-sm animate-fade-in whitespace-nowrap ${item.type === 'fact' ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-amber-100 text-amber-700 border border-amber-200'}`}>
                                        {item.answer}
                                    </span>
                                ) : (
                                    <span className="text-slate-400 group-hover:text-indigo-500 transition whitespace-nowrap text-sm font-bold uppercase tracking-wider">
                                        Reveal <i className="fas fa-eye ml-1"></i>
                                    </span>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Lesson1 = ({ setActiveTab }) => (
            <div className="max-w-5xl mx-auto animate-fade-in pb-12">
                <div className="bg-indigo-600 text-white rounded-3xl p-8 shadow-lg mb-8 relative overflow-hidden">
                    {/* Secret corner for the teacher to access Lesson 2 */}
                    <div 
                        className="absolute top-0 right-0 w-20 h-20 z-50 cursor-pointer" 
                        onClick={() => setActiveTab('lesson2')}
                    ></div>
                    
                    <div className="relative z-10">
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold tracking-wider uppercase mb-4 inline-block">Lesson 1 (40 Mins)</span>
                        <h2 className="text-4xl font-extrabold mb-2">Reading Critically: Fact vs. Opinion</h2>
                        <p className="text-indigo-100 text-lg max-w-2xl">Learn to identify the writer's subjective attitude versus objective facts to improve your reading comprehension.</p>
                    </div>
                    <i className="fas fa-book-reader absolute -bottom-6 -right-6 text-9xl text-indigo-500 opacity-50 transform -rotate-12"></i>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                        <h3 className="text-2xl font-black text-emerald-600 mb-2 uppercase tracking-wide">FACT</h3>
                        <p className="text-slate-600 mb-4 font-medium text-lg leading-relaxed">A statement that can be proven true or false using objective evidence.</p>
                        <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                            <span className="text-xs font-bold text-emerald-500 uppercase tracking-widest block mb-1">Example</span>
                            <p className="text-slate-700 italic">"The human heart beats approximately 100,000 times a day."</p>
                        </div>
                    </div>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-amber-500">
                        <h3 className="text-2xl font-black text-amber-600 mb-2 uppercase tracking-wide">OPINION</h3>
                        <p className="text-slate-600 mb-4 font-medium text-lg leading-relaxed">A statement that expresses a person's feelings, beliefs, or predictions.</p>
                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                            <span className="text-xs font-bold text-amber-500 uppercase tracking-widest block mb-1">Example</span>
                            <p className="text-slate-700 italic">"The blue painting is much more beautiful than the red one."</p>
                        </div>
                    </div>
                </div>

                <div className="bg-sky-900 text-white p-8 rounded-3xl shadow-md border-2 border-sky-700 relative">
                    <h3 className="text-2xl font-bold mb-4 flex items-center"><i className="fas fa-search text-sky-400 mr-3"></i> Text Analysis (Page 72-73)</h3>
                    <p className="mb-6 text-sky-100 text-lg">Use two different highlighters. Highlight <strong className="text-emerald-400">facts</strong> in one color, and <strong className="text-amber-400">opinions</strong> in another.</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-sky-800 p-4 rounded-xl border border-sky-600 shadow-inner">
                            <p className="font-bold text-sky-300 mb-1">Article A:</p>
                            <p className="text-sm text-sky-100">Red means winning!</p>
                        </div>
                        <div className="bg-sky-800 p-4 rounded-xl border border-sky-600 shadow-inner">
                            <p className="font-bold text-amber-400 mb-1">Article B:</p>
                            <p className="text-sm text-sky-100">The best color for sleep?</p>
                        </div>
                        <div className="bg-sky-800 p-4 rounded-xl border border-sky-600 shadow-inner">
                            <p className="font-bold text-emerald-400 mb-1">Article C:</p>
                            <p className="text-sm text-sky-100">Can color help us eat a healthier diet?</p>
                        </div>
                    </div>
                    <p className="mt-6 font-medium text-sky-200">As you read, ask yourself: What is fact, and what is opinion? Which article is the least convincing?</p>
                </div>

                <FactOpinionPractice />
            </div>
        );

        const Lesson2 = ({ setActiveTab }) => {
            const [teamAScore, setTeamAScore] = useState(0);
            const [teamBScore, setTeamBScore] = useState(0);
            const [currentQ, setCurrentQ] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);

            // 22 Total Questions (Unit 7 Reading Text + General Fact/Opinion)
            const questions = [
                // True/False/Not Given (Based strictly on the provided Unit 7 Article on Page 73)
                { type: "T / F / NG", text: "In sports like boxing and taekwondo, competitors wearing red win over 60% of matches when they have similar skill and strength to their opponent.", answer: "True", evidence: "Article A states: 'However, in matches between competitors with a similar level of strength and skill, over 60% were won by people dressed in red.'" },
                { type: "T / F / NG", text: "If one combat sports competitor is much stronger and more skilled than their opponent, wearing a red uniform will still significantly increase their chances of winning.", answer: "False", evidence: "Article A states: 'The researchers found that, when one competitor was much better than the other, the color of the uniform had no effect on the results.'" },
                { type: "T / F / NG", text: "According to interior designer Jackie Bellini, sleeping in a purple bedroom is highly recommended for reducing stress.", answer: "False", evidence: "Article B states: 'Purple scored worst in the survey... According to Jackie, it's thought that the color stimulates creativity, which makes it an environment where vivid dreams and nightmares are more likely.'" },
                { type: "T / F / NG", text: "The sleep pattern survey conducted by hotel chain Indigo included participants from five different European countries.", answer: "Not Given", evidence: "Article B mentions the survey involved '200 homes around the country', but it does not specify anything about 'five different European countries'." },
                { type: "T / F / NG", text: "Interior designer Jackie Bellini prefers using blue paint instead of blue wallpaper when decorating hotel bedrooms.", answer: "Not Given", evidence: "Article B mentions Jackie Bellini as an interior designer and color expert, but it does not state whether she prefers paint or wallpaper." },
                { type: "T / F / NG", text: "In a 1970s experiment, participants felt physically sick eating blue steak because the meat tasted rotten.", answer: "False", evidence: "Article C states: 'The guests' visual disgust was strong enough to cause sickness, even though they knew the meat tasted good.'" },
                { type: "T / F / NG", text: "Charles Spence argues that our eyes influence our experience of food even more than our sense of smell and taste.", answer: "True", evidence: "Article C states: 'According to Oxford's Charles Spence, however, our eyes influence our experience of food even more than our tongues and noses.'" },
                { type: "T / F / NG", text: "In a recent taste test, a green drink contained more sugar than a pink drink, but participants still thought the pink drink tasted sweeter.", answer: "True", evidence: "Article C states: 'In recent tests, many people thought a pink drink tasted sweeter than a green one, even though the green one contained 10% more sugar.'" },
                
                // Fact vs Opinion (Set 1: General & Color)
                { type: "Fact vs Opinion", text: "Blue light from smartphone screens prevents the human body from producing sleep hormones.", answer: "Fact", evidence: "This is a medical claim that can be objectively proven or disproven using scientific measurement." },
                { type: "Fact vs Opinion", text: "Bright, vibrant colors look terrible in a relaxing space like a library.", answer: "Opinion", evidence: "This relies on personal taste. Someone else might think bright colors look great in a library." },
                { type: "Fact vs Opinion", text: "A 2023 study found that consumers are 40% more likely to click a digital ad if the button is red.", answer: "Fact", evidence: "This statement relies on verifiable data and statistics from a specific study." },
                { type: "Fact vs Opinion", text: "The most beautiful paintings in the world are the ones that use warm color palettes.", answer: "Opinion", evidence: "Beauty is completely subjective and cannot be measured scientifically." },
                { type: "Fact vs Opinion", text: "Human eyes contain special cells called cones that allow us to distinguish between millions of colors.", answer: "Fact", evidence: "This is an anatomical claim that can be verified by biology textbooks and research." },
                
                // Fact vs Opinion (Set 2: High-Level)
                { type: "Fact vs Opinion", text: "Governments should ban food companies from using artificial food dyes in children's snacks.", answer: "Opinion", evidence: "Words like 'should' express a belief, feeling, or recommendation, not a provable fact." },
                { type: "Fact vs Opinion", text: "Historical records show that in ancient Rome, purple dye was so expensive it was restricted to the Emperor.", answer: "Fact", evidence: "Historical records can be objectively checked to prove or disprove this statement." },
                { type: "Fact vs Opinion", text: "Black is ultimately the most professional and sophisticated color to wear to a job interview.", answer: "Opinion", evidence: "Professionalism in color is a matter of cultural or personal preference, not an objective truth." },
                { type: "Fact vs Opinion", text: "Color blindness is a genetic condition that affects a higher percentage of men than women globally.", answer: "Fact", evidence: "This is a medical and statistical claim that can be verified through data." },
                { type: "Fact vs Opinion", text: "Schools must repaint all their classrooms light green because it is the only way to help students focus.", answer: "Opinion", evidence: "Saying what someone 'must' do, or claiming it is the 'only way', is a subjective recommendation." },
                
                // Fact vs Opinion (Set 3: Additional)
                { type: "Fact vs Opinion", text: "The color orange is created by mixing red and yellow pigments together in equal parts.", answer: "Fact", evidence: "This is a verifiable physical property of pigments and color mixing." },
                { type: "Fact vs Opinion", text: "Painting a hospital waiting room orange is a terrible idea because it makes people feel far too energetic.", answer: "Opinion", evidence: "Calling it a 'terrible idea' is a subjective judgment." },
                { type: "Fact vs Opinion", text: "Camouflage clothing uses colors like green, brown, and gray to help soldiers blend in with natural environments.", answer: "Fact", evidence: "The design purpose and color composition of camouflage can be factually verified." },
                { type: "Fact vs Opinion", text: "Winter is definitely the most depressing time of the year because the sky is constantly cloudy and gray.", answer: "Opinion", evidence: "Emotions tied to seasons are subjective; some people absolutely love winter." }
            ];

            const nextQuestion = () => {
                if (currentQ < questions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setShowAnswer(false);
                }
            };

            const prevQuestion = () => {
                if (currentQ > 0) {
                    setCurrentQ(currentQ - 1);
                    setShowAnswer(false);
                }
            };

            return (
                <div className="max-w-5xl mx-auto animate-fade-in pb-12">
                    <div className="bg-emerald-600 text-white rounded-3xl p-8 shadow-lg mb-8 relative overflow-hidden">
                        {/* Secret corner for the teacher to go back to Lesson 1 */}
                        <div 
                            className="absolute top-0 right-0 w-20 h-20 z-50 cursor-pointer" 
                            onClick={() => setActiveTab('lesson1')}
                        ></div>

                        <div className="relative z-10">
                            <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-bold tracking-wider uppercase mb-4 inline-block">Lesson 2 (40 Mins)</span>
                            <h2 className="text-4xl font-extrabold mb-2">Outdoor Action: Penalty Shoot-Out</h2>
                            <p className="text-emerald-100 text-lg">Use this interactive scoreboard to manage the outdoor game. Answer correctly for a chance to score!</p>
                        </div>
                    </div>

                    {}
                    <div className="grid grid-cols-2 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-8 border-t-emerald-500 text-center flex flex-col items-center">
                            <h3 className="text-3xl font-black text-emerald-600 mb-4 tracking-wide uppercase">Team A</h3>
                            <div className="flex justify-center items-center gap-4 w-full">
                                <button onClick={() => setTeamAScore(Math.max(0, teamAScore - 1))} className="w-16 h-16 flex items-center justify-center rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-black text-4xl shadow-sm transition active:scale-95">-</button>
                                <span className="text-7xl font-black text-slate-800 tabular-nums w-24">{teamAScore}</span>
                                <button onClick={() => setTeamAScore(teamAScore + 1)} className="w-16 h-16 flex items-center justify-center rounded-2xl bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-black text-4xl shadow-sm transition active:scale-95">+</button>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-md border-t-8 border-t-rose-500 text-center flex flex-col items-center">
                            <h3 className="text-3xl font-black text-rose-500 mb-4 tracking-wide uppercase">Team B</h3>
                            <div className="flex justify-center items-center gap-4 w-full">
                                <button onClick={() => setTeamBScore(Math.max(0, teamBScore - 1))} className="w-16 h-16 flex items-center justify-center rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-black text-4xl shadow-sm transition active:scale-95">-</button>
                                <span className="text-7xl font-black text-slate-800 tabular-nums w-24">{teamBScore}</span>
                                <button onClick={() => setTeamBScore(teamBScore + 1)} className="w-16 h-16 flex items-center justify-center rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-black text-4xl shadow-sm transition active:scale-95">+</button>
                            </div>
                        </div>
                    </div>

                    {/* Question Deck Section */}
                    <div className="bg-slate-800 rounded-3xl p-8 shadow-xl text-center mb-10 relative">
                        <span className="bg-slate-700 text-emerald-400 font-bold px-4 py-1 rounded-full text-xs uppercase tracking-widest mb-6 inline-block">
                            Question {currentQ + 1} of {questions.length} &bull; {questions[currentQ].type}
                        </span>
                        
                        <p className="text-2xl sm:text-3xl font-medium text-white mb-10 leading-relaxed max-w-3xl mx-auto">
                            "{questions[currentQ].text}"
                        </p>

                        <div className="min-h-[4rem] mb-8 flex justify-center items-center">
                            {showAnswer ? (
                                <div className="animate-fade-in flex flex-col items-center">
                                    <div className="inline-block bg-emerald-500 text-white font-black text-3xl px-8 py-3 rounded-xl transform scale-110 shadow-lg border-2 border-emerald-400 mb-6">
                                        {questions[currentQ].answer}
                                    </div>
                                    {questions[currentQ].evidence && (
                                        <div className="bg-slate-700 p-5 rounded-xl border border-slate-600 max-w-2xl text-left shadow-inner">
                                            <span className="text-emerald-400 font-bold text-xs uppercase tracking-widest block mb-2"><i className="fas fa-search mr-1"></i> Evidence / Reasoning:</span>
                                            <p className="text-slate-300 text-lg leading-relaxed italic">"{questions[currentQ].evidence}"</p>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowAnswer(true)}
                                    className="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-8 rounded-xl transition text-lg border border-slate-600 shadow-md active:scale-95"
                                >
                                    Reveal Answer
                                </button>
                            )}
                        </div>

                        <div className="flex justify-between items-center border-t border-slate-700 pt-6">
                            <button 
                                onClick={prevQuestion}
                                disabled={currentQ === 0}
                                className={`font-bold py-3 px-6 rounded-lg transition flex items-center ${currentQ === 0 ? 'opacity-30 cursor-not-allowed text-slate-500' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}`}
                            >
                                <i className="fas fa-chevron-left mr-2"></i> Previous
                            </button>
                            
                            <button 
                                onClick={nextQuestion}
                                disabled={currentQ === questions.length - 1}
                                className={`font-bold py-3 px-6 rounded-xl transition flex items-center ${currentQ === questions.length - 1 ? 'opacity-30 cursor-not-allowed bg-slate-700 text-slate-500' : 'bg-emerald-600 text-white hover:bg-emerald-500 shadow-md active:scale-95'}`}
                            >
                                Next Question <i className="fas fa-chevron-right ml-2"></i>
                            </button>
                        </div>
                    </div>

                    {/* Value Continuum Section */}
                    <div className="mb-4">
                        <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center"><i className="fas fa-arrows-alt-h text-emerald-500 mr-3"></i> Value Continuum Prompts</h3>
                        <div className="space-y-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <span className="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 1</span>
                                <p className="text-2xl font-medium text-slate-700 italic">"A permanent, traditional home is essential for a teenager's sense of security."</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <span className="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 2</span>
                                <p className="text-2xl font-medium text-slate-700 italic">"Vibrant colors in a classroom dramatically improve student performance."</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <span className="bg-emerald-100 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest mb-3 inline-block">Statement 3 (Text Connection - Page 74)</span>
                                <p className="text-2xl font-medium text-slate-700 italic">"Color is the most important factor in determining human performance."</p>
                                <p className="mt-4 text-slate-500 font-medium border-t border-slate-100 pt-4"><i className="fas fa-microphone mr-2"></i> Follow-up: What factors <em>apart</em> from color can affect your performance in sports, in class, or in other areas?</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('lesson1');

            return (
                <div className="min-h-screen font-sans">
                    <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4">
                            <div className="flex justify-between items-center py-4">
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center">
                                    <i className="fas fa-chalkboard-teacher text-indigo-600 mr-3"></i>
                                    Unit 7 Reading
                                </h1>
                            </div>
                        </div>
                    </header>

                    <main className="px-4 py-8">
                        {activeTab === 'lesson1' ? <Lesson1 setActiveTab={setActiveTab} /> : <Lesson2 setActiveTab={setActiveTab} />}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
